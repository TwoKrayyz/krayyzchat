<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>KrayyzChat | Sign In</title>
    </head>
    <body>
        <form id="signInForm">
            <label for="username">Username:</label><br />
            <input
                type="text"
                id="username"
                name="username"
                required
            />
            <br />
            <label for="password">Password:</label><br />
            <input
                type="text"
                id="password"
                name="password"
                required
            />
            <br />
            <input
                type="submit"
                name="submit"
            />
        </form>
        <script type="module" src="/public/scripts/script.js"></script>
    </body>
</html>
